<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة اختبار الربط مع Express</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .footer-note {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تسجيل البيانات (Test Page)</h2>
        
        <!-- يمكنك تغيير action إلى المسار الذي تستقبله في Express مثل /submit -->
        <form action="/submit" method="POST">
            
            <div class="form-group">
                <label for="username">اسم المستخدم (Username):</label>
                <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="form-group">
                <label for="userCode">كود المستخدم (User ID / Code):</label>
                <input type="number" id="userCode" name="userCode" placeholder="مثال: 1001" required>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني (Email):</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور (Password):</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit">إرسال البيانات إلى السيرفر</button>
        </form>

        <div class="footer-note">
            تم إنشاؤها لغرض تجربة ربط Node.js & Express
        </div>
    </div>

</body>
</html>
